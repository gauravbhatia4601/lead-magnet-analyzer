version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./lead_magnet_analyzer.db
      - API_KEY=secret
    volumes:
      - ./lead_magnet_analyzer.db:/app/lead_magnet_analyzer.db
      - ./results:/app/results
    restart: unless-stopped
